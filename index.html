<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تعزيز - دوري مجموعات كرة القدم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      font-family: 'Tajawal', system-ui, -apple-system, sans-serif;
      background: #0f172a;
      min-height: 100vh;
      color: #1e293b;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Photorealistic Stadium & Grass Background */
    .stadium-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      background: linear-gradient(180deg, #38bdf8 0%, #7dd3fc 45%, #e0f2fe 100%);
    }
    .clouds-layer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 190px;
      opacity: 0.45;
      pointer-events: none;
    }
    .stadium-stands {
      position: absolute;
      top: 96px;
      left: 0;
      right: 0;
      height: 256px;
      overflow: hidden;
      opacity: 0.9;
    }
    .floodlight {
      position: absolute;
      top: 8px;
      width: 120px;
      z-index: 10;
    }
    .floodlight.left { left: 24px; }
    .floodlight.right { right: 24px; }
    @media (max-width: 640px) {
      .floodlight { width: 85px; }
      .floodlight.left { left: 8px; }
      .floodlight.right { right: 8px; }
    }
    .floodlight-beam-left {
      position: absolute;
      top: -40px;
      left: -40px;
      width: 320px;
      height: 380px;
      opacity: 0.4;
      mix-blend-mode: screen;
      background: radial-gradient(circle at 40% 20%, rgba(254, 240, 138, 0.7) 0%, rgba(250, 204, 21, 0.25) 35%, transparent 70%);
      pointer-events: none;
    }
    .floodlight-beam-right {
      position: absolute;
      top: -40px;
      right: -40px;
      width: 320px;
      height: 380px;
      opacity: 0.4;
      mix-blend-mode: screen;
      background: radial-gradient(circle at 60% 20%, rgba(254, 240, 138, 0.7) 0%, rgba(250, 204, 21, 0.25) 35%, transparent 70%);
      pointer-events: none;
    }

    /* 3D Realistic Pitch Ground */
    .pitch-floor {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 46vh;
      perspective: 600px;
      overflow: hidden;
    }
    .pitch-grass {
      width: 100%;
      height: 100%;
      position: relative;
      background: repeating-linear-gradient(90deg, #16a34a 0px, #16a34a 80px, #22c55e 80px, #22c55e 160px);
      transform: rotateX(38deg) translateY(-8%);
      transform-origin: bottom center;
      box-shadow: inset 0 40px 60px rgba(0,0,0,0.3);
    }
    .pitch-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 100%, rgba(255,255,255,0.2) 0%, rgba(0,0,0,0.4) 90%);
    }

    /* Floating Stadium Confetti Flakes */
    .confetti-flake {
      position: absolute;
      border-radius: 2px;
      animation: bounceFlake infinite ease-in-out;
    }
    @keyframes bounceFlake {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-16px) rotate(15deg); }
    }

    /* Foreground Content Layout */
    .app-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      justify-content: space-between;
      padding: 10px 16px;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
    }

    /* Wooden Header Signboard */
    .header-board-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 4px 0 10px;
    }
    .header-board {
      background: linear-gradient(180deg, #b45309 0%, #92400e 30%, #78350f 75%, #451a03 100%);
      border: 3px solid #fef3c7;
      border-radius: 28px;
      padding: 8px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      box-shadow: 0 12px 24px -4px rgba(0,0,0,0.65), 0 4px 6px -2px rgba(0,0,0,0.4), inset 0 2px 3px rgba(254,243,199,0.45), inset 0 -3px 6px rgba(0,0,0,0.8);
      min-width: min(92vw, 490px);
      position: relative;
      transition: transform 0.2s;
    }
    .header-board:hover {
      transform: scale(1.01);
    }
    .wood-highlight-line {
      position: absolute;
      top: 6px;
      left: 16px;
      right: 16px;
      height: 2px;
      background: rgba(254, 243, 199, 0.4);
      border-radius: 9999px;
      pointer-events: none;
    }
    .header-bolt {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #451a03;
      border: 1px solid #fde68a;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
      opacity: 0.75;
    }
    .header-title-text {
      font-family: 'Changa', 'Tajawal', sans-serif;
      font-size: 2.6rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 3px 0 #78350f, 0 6px 1px #451a03, 0 8px 10px rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      line-height: 1.1;
    }
    @media (max-width: 640px) {
      .header-title-text { font-size: 1.9rem; }
      .header-board { padding: 6px 16px; gap: 12px; }
    }
    .header-subtitle-pill {
      margin-top: 4px;
      padding: 3px 18px;
      border-radius: 9999px;
      background: rgba(2, 6, 23, 0.82);
      border: 1px solid rgba(250, 204, 21, 0.7);
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .header-subtitle-text {
      color: #fef08a;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #facc15;
      animation: pulseDot 1.5s infinite;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 0.4; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* Teacher Control Bar */
    .control-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 8px 0 12px;
    }
    .counter-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      padding: 6px 16px;
      border-radius: 20px;
      border: 2px solid rgba(186, 230, 253, 0.9);
      box-shadow: 0 8px 18px -2px rgba(14, 165, 233, 0.25), inset 0 2px 0 rgba(255, 255, 255, 0.9);
    }
    .btn-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.3rem;
      color: #ffffff;
      cursor: pointer;
      transition: transform 0.12s;
    }
    .btn-circle:active {
      transform: scale(0.9);
    }
    .btn-minus {
      background: radial-gradient(circle at 35% 30%, #ef4444 0%, #dc2626 50%, #991b1b 100%);
      box-shadow: 0 4px 6px -1px rgba(220, 38, 38, 0.5), inset 0 2px 2px rgba(255, 255, 255, 0.6), inset 0 -2px 3px rgba(0, 0, 0, 0.4);
      border: 2px solid #fecaca;
    }
    .btn-plus {
      background: radial-gradient(circle at 35% 30%, #22c55e 0%, #16a34a 50%, #166534 100%);
      box-shadow: 0 4px 6px -1px rgba(22, 163, 74, 0.5), inset 0 2px 2px rgba(255, 255, 255, 0.6), inset 0 -2px 3px rgba(0, 0, 0, 0.4);
      border: 2px solid #bbf7d0;
    }
    .btn-add-group {
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 40%, #0369a1 100%);
      border: 2.5px solid #e0f2fe;
      border-radius: 20px;
      padding: 8px 20px;
      color: #ffffff;
      font-weight: 900;
      font-family: 'Changa', 'Tajawal', sans-serif;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 8px 16px -2px rgba(2, 132, 199, 0.45), inset 0 2px 2px rgba(255, 255, 255, 0.6), inset 0 -3px 4px rgba(0, 0, 0, 0.4);
      text-shadow: 0 2px 3px rgba(0,0,0,0.5);
      transition: transform 0.12s;
    }
    .btn-add-group:active {
      transform: scale(0.95);
    }
    .tool-bar-center {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 18px;
      border: 1px solid #e0f2fe;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .tool-icon-btn {
      padding: 7px 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
      background: #f1f5f9;
      color: #334155;
      transition: all 0.15s;
    }
    .tool-icon-btn:hover {
      background: #e2e8f0;
      color: #0f172a;
    }
    .tool-icon-btn.coronation {
      background: #f59e0b;
      color: #ffffff;
      font-weight: 900;
      box-shadow: 0 2px 4px rgba(245, 158, 11, 0.4);
    }
    .tool-icon-btn.coronation:hover {
      background: #d97706;
    }

    /* Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin: 12px 0 16px;
      justify-items: center;
      align-items: center;
      width: 100%;
    }
    .team-card {
      position: relative;
      width: 100%;
      max-width: 295px;
      height: 460px;
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.25s, box-shadow 0.25s;
    }
    .team-card:hover {
      transform: translateY(-4px);
    }

    /* Card Header */
    .card-header {
      padding: 14px;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .card-dark-pill {
      width: 100%;
      padding: 8px 12px;
      border-radius: 18px;
      text-align: center;
      cursor: pointer;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
      position: relative;
      transition: filter 0.15s;
    }
    .card-dark-pill:hover {
      filter: brightness(1.2);
    }
    .card-team-title {
      color: #ffffff;
      font-weight: 900;
      font-size: 1.15rem;
      line-height: 1.2;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
    .card-team-sub {
      color: #fef08a;
      font-family: 'Changa', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      line-height: 1.2;
    }
    .edit-corner-icon {
      position: absolute;
      top: 6px;
      left: 8px;
      font-size: 0.75rem;
      opacity: 0.6;
      color: #fde68a;
    }

    /* Central Score Row */
    .score-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 8px 12px;
    }
    .score-pill {
      padding: 6px 24px;
      border-radius: 18px;
      min-width: 105px;
      text-align: center;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 4px 6px rgba(0,0,0,0.25);
    }
    .score-number {
      font-family: 'Changa', sans-serif;
      font-size: 2.4rem;
      font-weight: 900;
      line-height: 1;
      display: block;
    }
    .score-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #fef08a;
      display: block;
      margin-top: 2px;
    }

    /* Balls Tray */
    .balls-tray {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
      overflow: hidden;
    }
    .balls-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      justify-items: center;
      align-items: center;
      max-width: 210px;
    }
    .empty-tray {
      color: #64748b;
      font-size: 0.85rem;
      font-weight: 700;
      text-align: center;
      opacity: 0.7;
    }

    /* Card Bottom Action Pill */
    .card-footer {
      padding: 12px;
      padding-top: 4px;
    }
    .action-pill {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 18px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      box-shadow: 0 4px 6px rgba(0,0,0,0.06);
    }
    .btn-act {
      width: 48px;
      height: 38px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 1.5rem;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .btn-act:active {
      transform: scale(0.92);
    }
    .btn-act-sub {
      background: linear-gradient(180deg, #f87171 0%, #ef4444 40%, #dc2626 70%, #991b1b 100%);
      box-shadow: 0 4px 6px -1px rgba(220, 38, 38, 0.5), inset 0 2px 2px rgba(255, 255, 255, 0.6), inset 0 -2px 3px rgba(0, 0, 0, 0.4);
      border: 2px solid #fecaca;
    }
    .btn-act-add {
      background: linear-gradient(180deg, #4ade80 0%, #22c55e 40%, #16a34a 70%, #15803d 100%);
      box-shadow: 0 4px 6px -1px rgba(22, 163, 74, 0.5), inset 0 2px 2px rgba(255, 255, 255, 0.6), inset 0 -2px 3px rgba(0, 0, 0, 0.4);
      border: 2px solid #bbf7d0;
    }

    /* Rank Medal */
    .rank-medal {
      position: absolute;
      top: -12px;
      left: -12px;
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .medal-disc {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 4px 6px rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Changa', sans-serif;
      font-weight: 900;
      font-size: 1.2rem;
    }
    .medal-ribbons {
      display: flex;
      gap: 3px;
      margin-top: -4px;
    }
    .ribbon {
      width: 10px;
      height: 14px;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 70%, 0 100%);
    }

    /* Floating Golden Crown for Top Leader */
    .crown-leader {
      position: absolute;
      top: -40px;
      left: 0;
      right: 0;
      margin: 0 auto;
      width: 64px;
      height: 48px;
      z-index: 30;
      animation: crownBounce 2.2s infinite ease-in-out;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,0.5)) drop-shadow(0 0 12px rgba(250, 204, 21, 0.9));
      pointer-events: none;
    }
    @keyframes crownBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    /* 3D Spinning Soccer Ball Animation entering into Board */
    .flying-ball {
      position: fixed;
      pointer-events: none;
      z-index: 99999;
      width: 52px;
      height: 52px;
      animation: spinFlyIntoBoard 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      will-change: transform, opacity;
    }
    .flying-ball-aura {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(250, 204, 21, 0.8) 0%, rgba(245, 158, 11, 0.35) 50%, transparent 75%);
      pointer-events: none;
      z-index: -1;
      filter: blur(4px);
    }
    .flying-ball-inner {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      animation: continuousBallSpin 0.28s linear infinite;
    }
    @keyframes continuousBallSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinFlyIntoBoard {
      0% {
        transform: translate(0px, 0px) scale(0.65);
        opacity: 0.9;
      }
      25% {
        transform: translate(calc(var(--target-x, 0px) * 0.25), calc(var(--target-y, 0px) * 0.3 - 80px)) scale(1.45);
        opacity: 1;
      }
      60% {
        transform: translate(calc(var(--target-x, 0px) * 0.75), calc(var(--target-y, 0px) * 0.75 - 30px)) scale(1.2);
        opacity: 1;
      }
      85% {
        transform: translate(calc(var(--target-x, 0px) * 0.96), calc(var(--target-y, 0px) * 0.96)) scale(1.05);
        opacity: 1;
      }
      100% {
        transform: translate(var(--target-x, 0px), var(--target-y, 0px)) scale(0.85);
        opacity: 0;
      }
    }

    /* Bottom Trophy on Pitch Center */
    .trophy-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin: 10px 0 6px;
      position: relative;
      transition: transform 0.2s;
    }
    .trophy-section:hover {
      transform: scale(1.05);
    }
    .trophy-ray-flare {
      position: absolute;
      top: -50px;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(250, 204, 21, 0.7) 0%, rgba(245, 158, 11, 0.25) 45%, transparent 70%);
      opacity: 0.6;
      mix-blend-mode: screen;
      pointer-events: none;
      animation: pulseFlare 3s infinite ease-in-out;
    }
    @keyframes pulseFlare {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 0.8; }
    }
    .trophy-leader-tag {
      background: rgba(69, 26, 3, 0.95);
      border: 1.5px solid rgba(250, 204, 21, 0.8);
      color: #fef08a;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 3px 16px;
      border-radius: 9999px;
      margin-top: 4px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Modals */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.82);
      backdrop-filter: blur(8px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-content-card {
      background: #0f172a;
      border: 3px solid #38bdf8;
      border-radius: 28px;
      width: 100%;
      max-width: 520px;
      color: #ffffff;
      padding: 24px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.85);
      position: relative;
    }
    .modal-header-title {
      font-family: 'Changa', sans-serif;
      font-size: 1.6rem;
      font-weight: 900;
      color: #facc15;
      text-align: center;
      margin-bottom: 12px;
    }
    .modal-text-field {
      width: 100%;
      background: #1e293b;
      border: 1.5px solid #475569;
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      margin-bottom: 12px;
      font-family: inherit;
    }
    .modal-text-field:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .modal-btn-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .modal-action-btn {
      flex: 1;
      padding: 11px 16px;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      font-family: inherit;
    }
  </style>
</head>
<body>

  <!-- 100% IDENTICAL STADIUM BACKGROUND & LIGHTS -->
  <div class="stadium-bg">
    <!-- Fluffy Clouds -->
    <div class="clouds-layer">
      <svg viewBox="0 0 1200 240" style="width:100%;height:100%;object-fit:cover;">
        <path d="M50 140 Q90 80 150 110 Q210 50 290 90 Q350 70 410 120 Q480 90 550 130 L550 240 L50 240 Z" fill="white" opacity="0.8" />
        <path d="M600 120 Q660 60 740 90 Q820 40 900 80 Q980 50 1060 110 Q1120 70 1180 130 L1180 240 L600 240 Z" fill="white" opacity="0.7" />
      </svg>
    </div>

    <!-- Left Floodlight Tower with 6 glowing fixtures -->
    <div class="floodlight left">
      <svg viewBox="0 0 120 160" width="100%">
        <polygon points="20,160 38,40 82,40 100,160 70,160 50,40 40,160" fill="#334155" opacity="0.85" />

    // 100% IDENTICAL SYNTHESIZED WEB AUDIO API SOUND SYSTEM
    class SoundEngine {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContextClass();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playKick() {
        if (!soundEnabled) return;
        this.init();
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, t);
        osc.frequency.exponentialRampToValueAtTime(35, t + 0.18);
        gain.gain.setValueAtTime(0.8, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.22);

        // swoosh
        try {
          const bufferSize = this.ctx.sampleRate * 0.15;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.4));
          }
          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(800, t);
          filter.frequency.exponentialRampToValueAtTime(300, t + 0.15);
          const nGain = this.ctx.createGain();
          nGain.gain.setValueAtTime(0.4, t);
          nGain.gain.linearRampToValueAtTime(0.01, t + 0.15);
          noise.connect(filter);
          filter.connect(nGain);
          nGain.connect(this.ctx.destination);
          noise.start(t);
        } catch(e) {}
      }
      playGoal() {
        this.playKick();
        if (!soundEnabled || !this.ctx) return;
        const t = this.ctx.currentTime + 0.05;
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t + idx * 0.05);
          gain.gain.setValueAtTime(0, t + idx * 0.05);
          gain.gain.linearRampToValueAtTime(0.25, t + idx * 0.05 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.05 + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t + idx * 0.05);
          osc.stop(t + idx * 0.05 + 0.36);
        });
      }
      playSubtract() {
        if (!soundEnabled) return;
        this.init();
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.frequency.setValueAtTime(260, t);
        osc.frequency.exponentialRampToValueAtTime(140, t + 0.15);
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.16);
      }
      playFanfare() {
        if (!soundEnabled) return;
        this.init();
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        const notes = [
          { f: 523.25, d: 0.15, o: 0.0 },
          { f: 523.25, d: 0.15, o: 0.18 },
          { f: 523.25, d: 0.15, o: 0.36 },
          { f: 659.25, d: 0.45, o: 0.54 },
          { f: 783.99, d: 0.35, o: 1.05 },
          { f: 1046.5, d: 0.8, o: 1.45 }
        ];
        notes.forEach(item => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(item.f, t + item.o);
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(2200, t + item.o);
          gain.gain.setValueAtTime(0, t + item.o);
          gain.gain.linearRampToValueAtTime(0.25, t + item.o + 0.04);
          gain.gain.setValueAtTime(0.22, t + item.o + item.d - 0.05);
          gain.gain.linearRampToValueAtTime(0.001, t + item.o + item.d);
          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t + item.o);
          osc.stop(t + item.o + item.d + 0.05);
        });
      }
    }

          <radialGradient id="cupCenter" cx="50%" cy="40%" r="50%">
            <stop offset="0%" stop-color="#fef9c3"/>
            <stop offset="50%" stop-color="#eab308"/>
            <stop offset="100%" stop-color="#713f12"/>
          </radialGradient>
          <linearGradient id="baseWood" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#451a03"/>
            <stop offset="40%" stop-color="#290e03"/>
            <stop offset="100%" stop-color="#1a0601"/>
          </linearGradient>
        </defs>
        <path d="M 50,45 C 10,45 8,85 50,95 L 50,85 C 22,78 24,53 50,55 Z" fill="url(#trophyGold)" stroke="#854d0e" stroke-width="1.5"/>
        <path d="M 110,45 C 150,45 152,85 110,95 L 110,85 C 138,78 136,53 110,55 Z" fill="url(#trophyGold)" stroke="#854d0e" stroke-width="1.5"/>
        <path d="M 45,35 Q 40,95 80,110 Q 120,95 115,35 Z" fill="url(#cupCenter)" stroke="#854d0e" stroke-width="2"/>
        <ellipse cx="80" cy="35" rx="36" ry="9" fill="url(#trophyGold)" stroke="#713f12" stroke-width="1.5"/>
        <ellipse cx="80" cy="35" rx="32" ry="6" fill="#a16207" opacity="0.8"/>
        <g transform="translate(80, 70)">
          <polygon points="0,-12 11,-4 7,10 -7,10 -11,-4" fill="#ca8a04" stroke="#713f12" stroke-width="1.5"/>
          <line x1="0" y1="-12" x2="0" y2="-20" stroke="#713f12" stroke-width="1.5"/>
          <line x1="11" y1="-4" x2="19" y2="-8" stroke="#713f12" stroke-width="1.5"/>
          <line x1="7" y1="10" x2="13" y2="18" stroke="#713f12" stroke-width="1.5"/>
          <line x1="-7" y1="10" x2="-13" y2="18" stroke="#713f12" stroke-width="1.5"/>
          <line x1="-11" y1="-4" x2="-19" y2="-8" stroke="#713f12" stroke-width="1.5"/>
        </g>
        <path d="M 50,42 Q 47,85 76,102 Q 62,85 60,45 Z" fill="url(#goldHl)"/>
        <path d="M 72,110 L 88,110 L 85,130 L 75,130 Z" fill="url(#trophyGold)" stroke="#713f12" stroke-width="1.5"/>
        <ellipse cx="80" cy="120" rx="10" ry="3" fill="#fef08a" stroke="#854d0e" stroke-width="1"/>
        <ellipse cx="80" cy="132" rx="20" ry="5" fill="url(#trophyGold)" stroke="#713f12" stroke-width="1.5"/>
        <path d="M 56,135 L 104,135 L 108,155 L 52,155 Z" fill="url(#baseWood)" stroke="#1a0601" stroke-width="1.5"/>
        <rect x="50" y="155" width="60" height="7" rx="2" fill="#290e03" stroke="#000000" stroke-width="1"/>
        <rect x="62" y="140" width="36" height="11" rx="1.5" fill="url(#trophyGold)" stroke="#713f12" stroke-width="0.8"/>
      </svg>`;
    }

    // 100% IDENTICAL 3D CROWN SVG
    function getCrownSVG() {
      return `<svg viewBox="0 0 100 65" width="100%" height="100%">
        <defs>
          <linearGradient id="crownGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fffbeb"/>
            <stop offset="25%" stop-color="#fef08a"/>
            <stop offset="60%" stop-color="#eab308"/>
            <stop offset="100%" stop-color="#854d0e"/>
          </linearGradient>
        </defs>
        <path d="M 12,50 L 22,20 L 38,36 L 50,10 L 62,36 L 78,20 L 88,50 Z" fill="url(#crownGrad)" stroke="#713f12" stroke-width="2.5" stroke-linejoin="round"/>
        <circle cx="22" cy="18" r="4.5" fill="#ef4444" stroke="#713f12" stroke-width="1.5"/>
        <circle cx="50" cy="8" r="5.5" fill="#3b82f6" stroke="#713f12" stroke-width="1.5"/>
        <circle cx="78" cy="18" r="4.5" fill="#10b981" stroke="#713f12" stroke-width="1.5"/>
        <rect x="16" y="44" width="68" height="7" rx="3" fill="#ca8a04" stroke="#713f12" stroke-width="1.5"/>
        <circle cx="30" cy="47.5" r="2.5" fill="#ffffff"/>
        <circle cx="50" cy="47.5" r="2.5" fill="#ffffff"/>
        <circle cx="70" cy="47.5" r="2.5" fill="#ffffff"/>
      </svg>`;
    }

    // EXACT THEMES SYSTEM
    const THEMES = {
      gold: {
        border: '#f59e0b',
        bg: 'linear-gradient(180deg, #fef3c7 0%, #fef9c3 35%, #ffffff 100%)',
        header: 'linear-gradient(180deg, #f59e0b 0%, #d97706 50%, #b45309 100%)',
        darkPill: '#451a03',
        scorePill: 'linear-gradient(180deg, #78350f 0%, #451a03 100%)',
        glow: 'rgba(245, 158, 11, 0.4)',
        starFill: '#fbbf24',
        starStroke: '#f59e0b',
        medal: { fill: '#fbbf24', stroke: '#b45309', ribbon: '#dc2626', text: '#78350f' }
      },
      blue: {
        border: '#0ea5e9',
        bg: 'linear-gradient(180deg, #e0f2fe 0%, #f0f9ff 35%, #ffffff 100%)',
        header: 'linear-gradient(180deg, #0ea5e9 0%, #0284c7 50%, #0369a1 100%)',
        darkPill: '#082f49',
        scorePill: 'linear-gradient(180deg, #0369a1 0%, #0c4a6e 100%)',
        glow: 'rgba(14, 165, 233, 0.4)',
        starFill: '#7dd3fc',
        starStroke: '#38bdf8',
        medal: { fill: '#e2e8f0', stroke: '#64748b', ribbon: '#3b82f6', text: '#1e293b' }
      },
      orange: {
        border: '#ea580c',
        bg: 'linear-gradient(180deg, #ffedd5 0%, #fff7ed 35%, #ffffff 100%)',
        header: 'linear-gradient(180deg, #ea580c 0%, #c2410c 50%, #9a3412 100%)',
        darkPill: '#431407',
        scorePill: 'linear-gradient(180deg, #9a3412 0%, #431407 100%)',
        glow: 'rgba(234, 88, 12, 0.4)',
        starFill: '#fdba74',
        starStroke: '#f97316',
        medal: { fill: '#d97706', stroke: '#78350f', ribbon: '#ea580c', text: '#fff' }
      },
      red: {
        border: '#e11d48',
        bg: 'linear-gradient(180deg, #ffe4e6 0%, #fff1f2 35%, #ffffff 100%)',
        header: 'linear-gradient(180deg, #e11d48 0%, #be123c 50%, #881337 100%)',
        darkPill: '#4c0519',
        scorePill: 'linear-gradient(180deg, #9f1239 0%, #4c0519 100%)',
        glow: 'rgba(225, 29, 72, 0.4)',
        starFill: '#fda4af',
        starStroke: '#fb7185',
        medal: { fill: '#cbd5e1', stroke: '#475569', ribbon: '#be123c', text: '#0f172a' }
      },
      green: {
        border: '#10b981',
        bg: 'linear-gradient(180deg, #d1fae5 0%, #ecfdf5 35%, #ffffff 100%)',
        header: 'linear-gradient(180deg, #10b981 0%, #059669 50%, #047857 100%)',
        darkPill: '#022c22',
        scorePill: 'linear-gradient(180deg, #047857 0%, #022c22 100%)',
        glow: 'rgba(16, 185, 129, 0.4)',
        starFill: '#6ee7b7',
        starStroke: '#34d399',
        medal: { fill: '#a7f3d0', stroke: '#059669', ribbon: '#047857', text: '#022c22' }
      },
      purple: {
        border: '#8b5cf6',
        bg: 'linear-gradient(180deg, #ede9fe 0%, #f5f3ff 35%, #ffffff 100%)',
        header: 'linear-gradient(180deg, #8b5cf6 0%, #7c3aed 50%, #5b21b6 100%)',
        darkPill: '#2e1065',
        scorePill: 'linear-gradient(180deg, #6d28d9 0%, #2e1065 100%)',
        glow: 'rgba(139, 92, 246, 0.4)',
        starFill: '#d8b4fe',
        starStroke: '#c084fc',
        medal: { fill: '#ddd6fe', stroke: '#6d28d9', ribbon: '#7c3aed', text: '#2e1065' }
      }
    };

    // Render Cards Grid
    function renderApp() {
      document.getElementById('groupCountDisplay').textContent = teams.length;

      const maxScore = Math.max(...teams.map(t => t.score), 0);
      const leader = maxScore > 0 ? teams.find(t => t.score === maxScore) : null;

      // Update Trophy Leader Tag
      const trophyText = document.getElementById('trophyLeaderText');
      if (leader) {
        trophyText.textContent = 'كأس الصدارة: ' + leader.name + ' (' + leader.nickname + ')';
      } else {
        trophyText.textContent = 'كأس البطولة: جاري التنافس...';
      }

      // Ranks
      const sortedUniqueScores = [...new Set(teams.map(t => t.score))].sort((a,b) => b - a);

      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';

      teams.forEach(team => {
        const theme = THEMES[team.theme] || THEMES.gold;
        const isLeader = leader && leader.id === team.id;
        const rank = sortedUniqueScores.indexOf(team.score) + 1;

        const card = document.createElement('div');
        card.id = 'team-card-' + team.id;
        card.className = 'team-card';
        card.style.background = theme.bg;
        card.style.border = '4px solid ' + theme.border;
        card.style.boxShadow = '0 16px 28px -6px rgba(0, 0, 0, 0.35), 0 6px 10px -3px rgba(0, 0, 0, 0.2), 0 0 16px ' + theme.glow + ', inset 0 2px 2px rgba(255, 255, 255, 0.8), inset 0 -3px 4px rgba(0, 0, 0, 0.12)';

        // Leader Crown
        let crownHtml = '';
        if (isLeader) {
          crownHtml = `<div class="crown-leader">${getCrownSVG()}</div>`;
        }

        // Rank Medal
        const medalHtml = `
          <div class="rank-medal" title="المركز ${rank}">
            <div class="medal-disc" style="background:radial-gradient(circle at 35% 30%, #fff 0%, ${theme.medal.fill} 60%, ${theme.medal.stroke} 100%);color:${theme.medal.text};">
              ${rank}
            </div>
            <div class="medal-ribbons">
              <div class="ribbon" style="background:${theme.medal.ribbon};"></div>
              <div class="ribbon" style="background:${theme.medal.ribbon};"></div>
            </div>
          </div>
        `;

        // Star SVG icon
        const starSVG = `<svg viewBox="0 0 24 24" width="24" height="24" fill="${theme.starFill}" stroke="${theme.starStroke}" stroke-width="1.5" style="filter:drop-shadow(0 2px 3px rgba(0,0,0,0.25));"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;

        // Display balls
        const maxDisplayBalls = 16;
        const displayBallCount = Math.min(team.score, maxDisplayBalls);
        const overflow = team.score - maxDisplayBalls;

        let ballsHtml = '';
        if (team.score === 0) {
          ballsHtml = `<div class="empty-tray">${getSoccerBallSVG(38)}<div style="margin-top:6px;font-weight:700;">لا توجد نقاط بعد</div></div>`;
        } else {
          let ballsList = '';
          for (let i = 0; i < displayBallCount; i++) {
            ballsList += `<div>${getSoccerBallSVG(36)}</div>`;
          }
          let overflowBadge = overflow > 0 ? `<div style="font-size:0.75rem;font-weight:900;background:rgba(15,23,42,0.85);color:#fde047;padding:2px 10px;border-radius:999px;margin-top:4px;">+${overflow} كرة إضافية</div>` : '';
          ballsHtml = `<div class="balls-grid">${ballsList}</div>${overflowBadge}`;
        }

        card.innerHTML = `
          ${crownHtml}
          ${medalHtml}

          <!-- Header -->
          <div class="card-header" style="background:${theme.header};border-bottom:2.5px solid ${theme.border};">
            <div class="card-dark-pill" style="background:${theme.darkPill};" onclick="openEditModal('${team.id}')" title="انقر لتعديل اسم ولقب الفريق">
              <span class="edit-corner-icon">✎ تعديل</span>
              <div class="card-team-title">${team.name}</div>
              <div class="card-team-sub">${team.nickname}</div>
            </div>
          </div>

          <!-- Score Row -->
          <div class="score-row">
            ${starSVG}
            <div class="score-pill" style="background:${theme.scorePill};">
              <span class="score-number">${team.score}</span>
              <span class="score-label">نقطة</span>
            </div>
            ${starSVG}
          </div>

          <!-- Balls Tray -->
          <div class="balls-tray">
            ${ballsHtml}
          </div>

          <!-- Bottom Action Buttons -->
          <div class="card-footer">
            <div class="action-pill">
              <button class="btn-act btn-act-sub" onclick="subPoint('${team.id}')" title="خصم نقطة">-</button>
              <div style="width:2px;height:24px;background:#cbd5e1;border-radius:999px;"></div>
              <button id="btn-add-${team.id}" class="btn-act btn-act-add" onclick="addPoint('${team.id}', event)" title="إضافة نقطة">+</button>
            </div>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // Add Point with Goal sound, 3D Spinning Flying Ball, and Confetti
    function addPoint(teamId, event) {
      audio.playGoal();
      const team = teams.find(t => t.id === teamId);
      if (team) {
        team.score++;
        persistTeams();
      }

      // Determine launch position from the clicked (+) button
      const btn = (event && (event.currentTarget || event.target)) || document.getElementById('btn-add-' + teamId);
      const btnRect = btn ? btn.getBoundingClientRect() : null;
      const startX = btnRect ? (btnRect.left + btnRect.width / 2) : (window.innerWidth / 2);
      const startY = btnRect ? (btnRect.top + btnRect.height / 2) : (window.innerHeight / 2 + 100);

      // Determine destination tray inside the team card
      const cardEl = document.getElementById('team-card-' + teamId);
      let targetX = startX;
      let targetY = startY - 180;
      if (cardEl) {
        const tray = cardEl.querySelector('.balls-tray');
        if (tray) {
          const trayRect = tray.getBoundingClientRect();
          targetX = trayRect.left + trayRect.width / 2;
          targetY = trayRect.top + trayRect.height / 2;
        } else {
          const cardRect = cardEl.getBoundingClientRect();
          targetX = cardRect.left + cardRect.width / 2;
          targetY = cardRect.top + cardRect.height * 0.62;
        }
      }

      const deltaX = targetX - startX;
      const deltaY = targetY - startY;

      // Create 3D spinning flying ball container
      const ball = document.createElement('div');
      ball.className = 'flying-ball';
      ball.style.left = (startX - 26) + 'px';
      ball.style.top = (startY - 26) + 'px';
      ball.style.setProperty('--target-x', deltaX + 'px');
      ball.style.setProperty('--target-y', deltaY + 'px');

      // Golden aura & spark glow
      const aura = document.createElement('div');
      aura.className = 'flying-ball-aura';
      ball.appendChild(aura);

      // Rapidly spinning 3D soccer ball inside
      const innerBall = document.createElement('div');
      innerBall.className = 'flying-ball-inner';
      innerBall.innerHTML = getSoccerBallSVG(52, true);
      ball.appendChild(innerBall);

      document.body.appendChild(ball);

      // Execute Web Animations API for guaranteed hardware-accelerated 60fps flight & 3D spin
      if (typeof ball.animate === 'function') {
        ball.animate([
          { transform: 'translate(0px, 0px) scale(0.65)', opacity: 0.9 },
          { transform: 'translate(' + (deltaX * 0.25) + 'px, ' + (deltaY * 0.3 - 85) + 'px) scale(1.45)', opacity: 1, offset: 0.25 },
          { transform: 'translate(' + (deltaX * 0.75) + 'px, ' + (deltaY * 0.75 - 35) + 'px) scale(1.2)', opacity: 1, offset: 0.60 },
          { transform: 'translate(' + (deltaX * 0.96) + 'px, ' + (deltaY * 0.96) + 'px) scale(1.05)', opacity: 1, offset: 0.85 },
          { transform: 'translate(' + deltaX + 'px, ' + deltaY + 'px) scale(0.85)', opacity: 0, offset: 1.0 }
        ], {
          duration: 850,
          easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
          fill: 'forwards'
        });

        innerBall.animate([
          { transform: 'rotate(0deg)' },
          { transform: 'rotate(1080deg)' }
        ], {
          duration: 850,
          easing: 'linear',
          fill: 'forwards'
        });
      }

      // Confetti burst from button
      if (window.confetti) {
        window.confetti({
          particleCount: 22,
          spread: 52,
          startVelocity: 28,
          origin: { x: startX / window.innerWidth, y: startY / window.innerHeight },
          colors: ['#facc15', '#38bdf8', '#22c55e', '#ffffff']
        });
      }

      // Re-render app to update scores and tray
      renderApp();

      // Board arrival impact pulse when the ball enters the board
      setTimeout(() => {
        const updatedCard = document.getElementById('team-card-' + teamId);
        if (updatedCard) {
          const tray = updatedCard.querySelector('.balls-tray');
          if (tray) {
            tray.style.transition = 'transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1)';
            tray.style.transform = 'scale(1.1)';
            setTimeout(() => {
              tray.style.transform = 'scale(1)';
            }, 220);
          }
        }
      }, 700);

      // Cleanup flying ball element
      setTimeout(() => {
        if (ball && ball.parentNode) {
          ball.remove();
        }
      }, 880);
    }

    function subPoint(teamId) {
      const team = teams.find(t => t.id === teamId);
      if (team && team.score > 0) {
        audio.playSubtract();
        team.score--;
        persistTeams();
        renderApp();
      }
    }

    // Add/Remove Team
    function addTeam() {
      if (teams.length >= 8) return;
      const themeKeys = ['gold', 'blue', 'orange', 'red', 'green', 'purple'];
      const nextTheme = themeKeys[teams.length % themeKeys.length];
      const newIdx = teams.length + 1;
      teams.push({
        id: 'team-' + Date.now(),
        name: 'الفريق ' + newIdx,
        nickname: 'الأبطال',
        score: 0,
        theme: nextTheme
      });
      persistTeams();
      audio.playKick();
      if (window.confetti) {
        window.confetti({ particleCount: 30, spread: 60, origin: { x: 0.8, y: 0.1 } });
      }
      renderApp();
    }

    function removeTeam() {
      if (teams.length <= 1) return;
      audio.playSubtract();
      teams.pop();
      persistTeams();
      renderApp();
    }

    // Edit Team Modal
    function openEditModal(teamId) {
      editingTeamId = teamId;
      const team = teams.find(t => t.id === teamId);
      if (!team) return;
      document.getElementById('editNameInput').value = team.name;
      document.getElementById('editNickInput').value = team.nickname;
      document.getElementById('editModal').style.display = 'flex';
    }
    function closeEditModal() {
      document.getElementById('editModal').style.display = 'none';
      editingTeamId = null;
    }
    function saveTeamEdit() {
      if (!editingTeamId) return;
      const team = teams.find(t => t.id === editingTeamId);
      if (team) {
        const n = document.getElementById('editNameInput').value.trim();
        const k = document.getElementById('editNickInput').value.trim();
        if (n) team.name = n;
        if (k) team.nickname = k;
        persistTeams();
      }
      closeEditModal();
      renderApp();
    }

    // Utilities
    function resetAllScores() {
      if (confirm('هل أنت متأكد من رغبتك في تصفير جميع نقاط الفرق؟')) {
        teams.forEach(t => t.score = 0);
        persistTeams();
        renderApp();
      }
    }

    function toggleAudio() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundToggleBtn').textContent = soundEnabled ? '🔊 المؤثرات: مفعلة' : '🔇 المؤثرات: صامتة';
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function coronateWinner() {
      const maxScore = Math.max(...teams.map(t => t.score), 0);
      const winner = maxScore > 0 ? teams.find(t => t.score === maxScore) : teams[0];
      if (!winner) return;

      audio.playFanfare();
      if (window.confetti) {
        window.confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
      }

      document.getElementById('winnerTeamName').textContent = winner.name;
      document.getElementById('winnerTeamNick').textContent = winner.nickname;
      document.getElementById('winnerScoreNum').textContent = winner.score;
      document.getElementById('winnerModal').style.display = 'flex';
    }
    function closeWinnerModal() {
      document.getElementById('winnerModal').style.display = 'none';
    }

    // Bootstrap Static SVGs
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('headerBallLeft').innerHTML = getSoccerBallSVG(52, true);
      document.getElementById('headerBallRight').innerHTML = getSoccerBallSVG(52, true);
      document.getElementById('btnBallAdd').innerHTML = getSoccerBallSVG(30);
      document.getElementById('goldenTrophySVG').innerHTML = getTrophySVG(125, 125);
      document.getElementById('winnerTrophySlot').innerHTML = getTrophySVG(110, 110);
      renderApp();
    });
  </script>
</body>
